<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar Variations</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #1a1a1a;
            color: white;
        }

        .nav-container {
            margin-bottom: 40px;
        }

        h2{
            margin-bottom: 20px;
        }

        .nav1{
            border: 2px solid red;
            background-color: #eaeaea;
            padding: 10px;
        }

        /* ul descendants of nav1  */
        .nav1 ul{
            list-style-type: none;
            display: flex;
            justify-content: space-around;
            margin: 0;
            padding: 0;
            align-items: center; /* Button aur text ko center align rakhne ke liye */
        }

        .nav1 li{
            display: inline;
        }

        .nav1 a {
            text-decoration: none;
            color: #202020;
            padding: 5px 15px;
            position: relative;
        }

        .nav1 .login-btn{
           background-color: skyblue;
           color: white;
           border: none;
           padding: 5px 15px;
           border-radius: 5px;
           cursor: pointer; /* crosshair se better pointer lagega */
        }

        /* IMPP after */
        .nav1 a::after{
           content: "";
           position: absolute;
           width: 100%;
           height: 2px;
           bottom: 0;
           left: 0;
           background-color: #0a65a7;
           transform: scaleX(0);
           transition: transform 0.3s ease-in-out; /* Spelling mistake thik ki 'sease-int-out' */
        }

         .nav1 a:hover::after{
            transform: scaleX(1);
         }

         /* Bhai, ab Hitesh bhai video me aage jo bhi .nav2 aur .nav3 ki 
            CSS likhenge, wo tum bina kisi chinta ke yahan neeche jodte jaana!
         */
         .nav2 {
             /* Hitesh bhai ki vertical vaali CSS yahan aayegi */
             background-color: #03643c;
             width: 200px;
             padding: 20px;
             /* text-align: center ; */
         }

         .nav2 ul{
            list-style-type: none;
            margin: 0;
            padding: 0;  
         }

        .nav2 li {
            margin-bottom: 12px;
        }

        .nav2 a{
            text-decoration: none ;
            color: #fff;
            display: block;
            padding: 10px;
            width: 100%;
        }

        .nav2 a:hover{
            background-color: orangered;
        }

        .nav2 .login-btn{
            background-color: blue;
            border: none;
            color: white;
            width:100%;
            padding: 10px;
            cursor: pointer ;
            margin-left: 9px;
        }

        .nav2 .login-btn:hover{
            background-color: rgb(189, 111, 189);
            border: 1px solid white;
        }

         .nav3 {
             /* Hitesh bhai ki dropdown vaali CSS yahan aayegi */
             background-color: #45a3bb;
             padding:10px;
         }

         .nav3 ul{
                list-style-type: none;
                padding: 0;
                margin: 0;
                display: flex;
                justify-content: space-around;
                align-items: center;
         }

         .nav3 a{
            text-decoration: none ;
            color: #fff;
            padding:10px;
            display: block;
         }

         .nav3 .dropdown-content{
            display: none;
         }

         .nav3 .dropdown:hover .dropdown-content{
            display: block ;
            position: absolute;
            background-color: #756f6f;
            min-width: 150px;
         }

         
    </style>
</head>
<body>

    <div class="nav-container">
        <h2>Variation 1: Horizontal with underline effect</h2>
        <nav class="nav1">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Products</a></li>
                <li><button class="login-btn">Login</button></li>
            </ul>
        </nav>
    </div>

    <div class="nav-container">
        <h2>Variation 2: Vertical with hover effect</h2>
        <nav class="nav2">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Products</a></li>
                <li><button class="login-btn">Login</button></li>
            </ul>
        </nav>
    </div>

    <div class="nav-container">
        <h2>Variation 3: Horizontal with dropdown</h2>
        <nav class="nav3">
            <ul>
                <li><a href="#">Home</a></li>
                 <li class="dropdown">
               <a href="#">About</a>
                 <div class="dropdown-content">
                    <a href="#">Our Story</a>
                    <a href="">Team</a>
                    <a href="">Contact</a>
                 </div>
               </li>
                </li><a href="#">Products</a> </li>
                <li><button class="login-btn">Login</button></li>
            </ul>
        </nav>
    </div>

</body>
</html>
